<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz do Amor ❤️</title>

<style>

body{
    background-image: url("quiz.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
    overflow: hidden;
}

.caixa{
    background: rgba(255,255,255,0.90);
    max-width: 600px;
    margin: auto;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

h1,h2,p{
    color:#333;
}

input{
    padding:10px;
    font-size:18px;
    border-radius:10px;
    border:1px solid #ccc;
    width:80%;
}

button{
    padding:12px 20px;
    margin:10px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#e63946;
    color:white;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.progresso{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:20px;
    margin-bottom:20px;
}

.barra{
    height:100%;
    width:0%;
    background:#ff4d6d;
    border-radius:20px;
    transition:0.5s;
}

.coracao{
    position:fixed;
    font-size:25px;
    pointer-events:none;
    animation:cair 4s linear forwards;
}

@keyframes cair{
    from{
        transform:translateY(-50px);
    }
    to{
        transform:translateY(100vh);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="caixa">

<h1>Quiz do Amor ❤️</h1>

<div class="progresso">
    <div class="barra" id="barra"></div>
</div>

<div id="inicio">

    <h2>Digite seu nome:</h2>

    <input
        type="text"
        id="nome"
        placeholder="Seu nome"
    >

    <br><br>

    <button onclick="comecar()">
        Começar
    </button>

</div>

<div id="quiz" style="display:none;">

    <h2 id="pergunta"></h2>

    <button onclick="responder()">
        Sim ❤️
    </button>

    <button onclick="responder()">
        Muito ❤️
    </button>

</div>

<div id="final"></div>

</div>

<script>

let etapa = 0;
let nomePessoa = "";

const perguntas = [
    "Você gosta de mim? ❤️",
    "Você sorri quando fala comigo? 😊",
    "Você gosta de passar tempo comigo? 🥰",
    "Você está preparada para a pergunta final? 💍"
];

function atualizarBarra(){

    let porcentagem =
    (etapa / perguntas.length) * 100;

    document.getElementById("barra").style.width =
    porcentagem + "%";
}

function comecar(){

    nomePessoa =
    document.getElementById("nome").value;

    if(nomePessoa.trim() === ""){
        alert("Digite seu nome!");
        return;
    }

    document.getElementById("inicio").style.display =
    "none";

    document.getElementById("quiz").style.display =
    "block";

    document.getElementById("pergunta").innerText =
    nomePessoa + ", " + perguntas[0];

    atualizarBarra();
}

function responder(){

    etapa++;

    atualizarBarra();

    if(etapa < perguntas.length){

        document.getElementById("pergunta").innerText =
        nomePessoa + ", " + perguntas[etapa];

    }else{

        document.getElementById("quiz").style.display =
        "none";

        document.getElementById("barra").style.width =
        "100%";

        document.getElementById("final").innerHTML =

        "<h2>" + nomePessoa +
        ", depois de tudo isso eu preciso te perguntar uma coisa... ❤️</h2>" +

        "<h1>Você aceita namorar comigo? 💍</h1>" +

        "<button onclick='sim()'>SIM ❤️</button>" +

        "<button onclick='semDuvidas()'>SEM DÚVIDAS ❤️😍</button>";
    }
}

function sim(){

    let amor =
    Math.floor(Math.random() * 11) + 90;

    document.getElementById("final").innerHTML =

    "<h1>❤️ Pedido Aceito ❤️</h1>" +

    "<p>" + nomePessoa +
    ", você acabou de fazer meu dia mais feliz! 😍</p>" +

    "<p>❤️ Compatibilidade: " +
    amor + "% ❤️</p>" +

    "<p>Nosso namoro começou em: 12/06/2026</p>" +

    "<h2>Te amo! ❤️</h2>";

    criarCoracoes();
}

function semDuvidas(){

    document.getElementById("final").innerHTML =

    "<h1>❤️ Perfeito! ❤️</h1>" +

    "<p>" + nomePessoa +
    ", eu já imaginava essa resposta! 😍</p>" +

    "<p>❤️ Nosso amor é 100% compatível! ❤️</p>" +

    "<p>Agora somos oficialmente um casal! 💍❤️</p>" +

    "<h2>Te amo! ❤️</h2>";

    criarCoracoes();
}

function criarCoracoes(){

    for(let i = 0; i < 50; i++){

        let coracao =
        document.createElement("div");

        coracao.innerHTML = "❤️";
        coracao.className = "coracao";

        coracao.style.left =
        Math.random() * 100 + "vw";

        coracao.style.animationDelay =
        Math.random() * 2 + "s";

        document.body.appendChild(coracao);

        setTimeout(() => {
            coracao.remove();
        }, 5000);
    }
}

</script>

</body>
</html>
